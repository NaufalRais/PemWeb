<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Furniture Shop - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
    <div class="login-container">

        <div class="login-card">
            <!-- Bagian Gambar -->
            <div class="login-image">
                <img src="https://www.freeiconspng.com/thumbs/login-icon/user-login-icon-29.png" alt="Furniture Shop Illustration">
            </div>


            <!-- Bagian Form Login -->
            <div class="login-form">

                <h1>Furniture Shop</h1>
                <p class="login-subtitle">Login to your account first</p>


                <!-- Form Login -->
                <form method="get" action="home.html">

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            📧 Email Address
                        </label>

                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>


                    <div class="mb-3">
                        <label for="password" class="form-label">
                            🔒 Password
                        </label>

                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" minlength="8" required>

                        <div class="form-text">
                            Password must contain at least 8 characters.
                        </div>
                    </div>


                    <button type="submit" class="btn btn-dark login-button">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
